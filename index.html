<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ዳንኤል የመኪና እጣ</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
    padding:20px;
    margin:0;
}

.container{
    max-width:1100px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

.ticket-preview{
    padding:20px;
    text-align:center;
    background:#f8fafc;
    border-bottom:3px solid #1e63d6;
}

.ticket-preview img{
    width:100%;
    max-width:420px;
    border:8px solid #0f2f8f;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.top{
    background:linear-gradient(135deg,#1e63d6,#0f2f8f);
    color:white;
    text-align:center;
    padding:20px;
}

.top h1{
    margin:0;
    font-size:28px;
}

.top h2{
    margin:10px 0;
    font-size:18px;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    padding:20px;
    background:#f6f9ff;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:14px;
    outline:none;
}

button{
    padding:14px;
    border:none;
    color:white;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn{
    grid-column:span 3;
    background:#1e63d6;
}

.reset-btn{
    grid-column:span 3;
    background:#dc2626;
}

button:hover{
    opacity:.9;
}

.slots{
    display:grid;
    grid-template-columns:repeat(9,1fr);
    gap:5px;
    padding:20px;
    max-height:500px;
    overflow:auto;
}

.slot{
    padding:12px;
    text-align:center;
    border:1px solid #ddd;
    border-radius:8px;
    cursor:pointer;
    background:white;
    font-size:14px;
    font-weight:bold;
}

.slot.filled{
    background:#22c55e;
    color:white;
}

.slot.selected{
    background:#1e63d6;
    color:white;
}

.list{
    padding:20px;
    max-height:300px;
    overflow:auto;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.empty{
    color:red;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

    <div class="ticket-preview">
        <img src="lottery-ticket.jpg" alt="Lottery Ticket">
    </div>

    <div class="top">
        <h1>ዳንኤል የመኪና እጣ</h1>
        <h2>ኢትዮጵያ ንግድ ባንክ 1000746664568</h2>
        <p>ዳንኤል ታዴ አድማሱ</p>
    </div>

    <div class="form">
        <input id="name" placeholder="Name">
        <input id="phone" type="number" placeholder="Phone">
        <input id="selectedSlot" placeholder="Selected Slot" readonly>

        <button class="register-btn" onclick="register()">Register</button>
        <button class="reset-btn" onclick="resetAll()">Reset All</button>
    </div>

    <div class="slots" id="slots"></div>
    <div class="list" id="list"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("lotteryData")) || {};
let selected = null;

const slotsDiv = document.getElementById("slots");
const listDiv = document.getElementById("list");

for(let i=1;i<=3000;i++){
    if(data[i]===undefined){
        data[i]=null;
    }
}

function saveData(){
    localStorage.setItem("lotteryData", JSON.stringify(data));
}

function renderSlots(){
    let html="";

    for(let i=1;i<=3000;i++){
        let cls="slot";

        if(data[i]) cls+=" filled";
        if(selected===i) cls+=" selected";

        html += `<div class="${cls}" onclick="selectSlot(${i})">${i}</div>`;
    }

    slotsDiv.innerHTML=html;
}

function selectSlot(i){
    selected=i;
    document.getElementById("selectedSlot").value=i;
    renderSlots();
}

function renderList(){
    listDiv.innerHTML="";

    for(let i=1;i<=3000;i++){
        const div=document.createElement("div");
        div.className="item";

        if(data[i]){
            div.innerHTML=`
                <div>#${i} - ${data[i].name}</div>
                <div>${data[i].phone}</div>
            `;
        }else{
            div.innerHTML=`
                <div>#${i}</div>
                <div class="empty">EMPTY</div>
            `;
        }

        listDiv.appendChild(div);
    }
}

function register(){
    const name=document.getElementById("name").value.trim();
    const phone=document.getElementById("phone").value.trim();

    if(!selected){
        alert("Select slot first");
        return;
    }

    if(!name || !phone){
        alert("Fill all fields");
        return;
    }

    if(data[selected]){
        alert("Slot already taken");
        return;
    }

    data[selected]={name,phone};
    saveData();

    document.getElementById("name").value="";
    document.getElementById("phone").value="";
    document.getElementById("selectedSlot").value="";
    selected=null;

    renderSlots();
    renderList();

    alert("Saved successfully");
}

function resetAll(){
    if(confirm("Delete all saved data?")){
        localStorage.removeItem("lotteryData");
        location.reload();
    }
}

renderSlots();
renderList();
</script>

</body>
</html>
